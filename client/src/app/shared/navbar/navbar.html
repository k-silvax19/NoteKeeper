<a
  class="sr-only focus:not-sr-only focus:absolute focus:top-3 focus:left-5 focus:z-20 focus:rounded-lg focus:bg-white focus:p-3"
  href="#conteudo"
  (click)="closeMenu()"
  >Pular para o conteúdo</a
>
<header class="border-b border-[#e4e7de] bg-[#faf9f6] text-[#253c32]">
  <div
    class="mx-auto flex min-h-20 w-[calc(100%-36px)] max-w-[1120px] flex-wrap items-center justify-between gap-x-4 sm:min-h-[88px] sm:w-[calc(100%-64px)]"
  >
    <a
      class="inline-flex shrink-0 items-center gap-2.5 py-3 text-xl font-bold tracking-tight sm:text-2xl"
      href="#"
      aria-label="NoteKeeper, início"
      (click)="closeMenu()"
    >
      <span
        class="grid size-10 place-items-center rounded-xl bg-[#284e3c] pb-1 font-serif text-3xl text-white shadow-sm"
        aria-hidden="true"
        >n.</span
      >
      <span>NoteKeeper<span class="text-[#699877]">.</span></span>
    </a>

    @if (sessao(); as sessaoAtual) {
      <button
        #menuToggle
        type="button"
        class="inline-flex size-11 cursor-pointer items-center justify-center rounded-xl border border-[#dce2d6] hover:bg-[#edf0e8] lg:hidden"
        aria-controls="navbar-links"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="menuOpen() ? 'Fechar menu' : 'Abrir menu'"
        (click)="menuOpen.set(!menuOpen())"
      >
        @if (menuOpen()) { <svg lucideX class="size-5" aria-hidden="true"></svg> } @else { <svg lucideMenu class="size-5" aria-hidden="true"></svg> }
      </button>
      <nav
        id="navbar-links"
        class="w-full flex-col gap-2 border-t border-[#e4e7de] pt-3 pb-4 text-sm font-semibold lg:flex lg:w-auto lg:flex-row lg:items-center lg:gap-2 lg:border-0 lg:py-0"
        [class.hidden]="!menuOpen()"
        [class.flex]="menuOpen()"
        aria-label="Navegação principal"
        (keydown.escape)="closeMenu(); menuToggle.focus()"
      >
        <a
          class="inline-flex items-center justify-center gap-4 rounded-full bg-[#2e543f] px-5 py-3 text-white shadow-sm transition-colors hover:bg-[#1e3e2c] motion-reduce:transition-none"
          href="#notas"
          (click)="closeMenu()"
        >
          Quadro de notas
          <svg lucideArrowUpRight class="size-4" aria-hidden="true"></svg>
        </a>

        <a
          class="inline-flex items-center justify-center gap-4 rounded-full bg-[#936639] px-5 py-3 text-white shadow-sm transition-colors hover:bg-[#a68a64] motion-reduce:transition-none"
          href="#categorias"
          (click)="closeMenu()"
        >
          Categorias
          <svg lucideArrowUpRight class="size-4" aria-hidden="true"></svg>
        </a>
        <div
          class="mt-3 flex min-w-0 items-center gap-3 border-t border-[#dce2d6] pt-4 lg:mt-0 lg:ml-3 lg:border-t-0 lg:border-l lg:pt-0 lg:pl-5"
        >
          <span
            class="grid size-10 shrink-0 place-items-center rounded-full border border-[#d1ddc9] bg-[#e8efdf] text-sm font-bold text-[#355841]"
            aria-hidden="true"
            >{{ sessaoAtual.usuario.nome.charAt(0).toUpperCase() }}</span
          >
          <div class="min-w-0 flex-1 lg:max-w-36">
            <span class="block text-xs font-medium text-[#68745e]">Minha conta</span>
            <span
              class="block truncate text-[13px] font-semibold text-[#253c32]"
              [title]="sessaoAtual.usuario.nome"
              >{{ sessaoAtual.usuario.nome }}</span
            >
          </div>
          <button
            type="button"
            (click)="closeMenu(); authService.encerrarSessao()"
            title="Sair da conta"
            aria-label="Sair da conta"
            class="inline-flex size-11 shrink-0 cursor-pointer items-center justify-center rounded-lg border border-[#e0e5da] text-[#727971] hover:bg-[#edf0e8] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#638365]"
          >
            <svg lucideLogOut class="size-[18px]" aria-hidden="true"></svg>
          </button>
        </div>
      </nav>
    } @else {
      <div
        class="mt-3 flex min-w-0 items-center gap-3 border-t border-[#dce2d6] pt-4 lg:mt-0 lg:ml-3 lg:border-t-0 lg:border-l lg:pt-0 lg:pl-5"
      >
        <div class="min-w-0 flex-1 lg:max-w-36">
          <span class="block truncate text-[13px] font-semibold text-[#253c32]" title="Criar Conta"
            >Criar Conta</span
          >
        </div>
        <button
          type="button"
          title="Criar Conta"
          routerLink="/cadastro"
          (click)="closeMenu()"
          aria-label="Criar uma conta"
          class="inline-flex size-11 shrink-0 cursor-pointer items-center justify-center rounded-lg border border-[#e0e5da] text-[#727971] hover:bg-[#edf0e8] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#638365]"
        >
          <svg lucideUserPlus class="size-[18px]" aria-hidden="true"></svg>
        </button>
      </div>
    }
  </div>
</header>
