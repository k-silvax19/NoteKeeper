<a
  class="sr-only focus:not-sr-only focus:absolute focus:top-3 focus:left-5 focus:z-20 focus:rounded-lg focus:bg-white focus:p-3"
  href="#conteudo"
  (click)="closeMenu()"
  >Pular para o conteúdo</a
>
<header class="border-b border-[#e4e7de] bg-[#faf9f6] text-[#253c32]">
  <div
    class="mx-auto flex min-h-20 w-[calc(100%-36px)] max-w-[1120px] flex-wrap items-center justify-between gap-x-4 sm:min-h-[88px] sm:w-[calc(100%-64px)]"
  >
    <a
      class="inline-flex shrink-0 items-center gap-2.5 py-3 text-xl font-bold tracking-tight sm:text-2xl"
      href="#"
      aria-label="NoteKeeper, início"
      (click)="closeMenu()"
    >
      <span
        class="grid size-10 place-items-center rounded-xl bg-[#284e3c] pb-1 font-serif text-3xl text-white shadow-sm"
        aria-hidden="true"
        >n.</span
      >
      <span>NoteKeeper<span class="text-[#699877]">.</span></span>
    </a>
    <button
      #menuToggle
      type="button"
      class="inline-flex size-11 cursor-pointer items-center justify-center rounded-xl border border-[#dce2d6] hover:bg-[#edf0e8] sm:hidden"
      aria-controls="navbar-links"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? 'Fechar menu' : 'Abrir menu'"
      (click)="menuOpen.set(!menuOpen())"
    >
      <svg
        class="size-5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        aria-hidden="true"
      >
        @if (menuOpen()) {
          <path d="m6 6 12 12M6 18 18 6" />
        } @else {
          <path d="M4 6h16M4 12h16M4 18h16" />
        }
      </svg>
    </button>
    <nav
      id="navbar-links"
      class="w-full flex-col gap-2 border-t border-[#e4e7de] pt-3 pb-4 text-sm font-semibold sm:flex sm:w-auto sm:flex-row sm:items-center sm:gap-5 sm:border-0 sm:py-0"
      [class.hidden]="!menuOpen()"
      [class.flex]="menuOpen()"
      aria-label="Navegação principal"
      (keydown.escape)="closeMenu(); menuToggle.focus()"
    >
      <a
        class="rounded-lg px-4 py-3 text-[#566950] transition-colors hover:bg-[#edf0e8] hover:text-[#253c32] motion-reduce:transition-none"
        href="#recursos"
        (click)="closeMenu()"
        >Como funciona</a
      >
      <a
        class="inline-flex items-center justify-center gap-4 rounded-lg bg-[#2e543f] px-5 py-3 text-white shadow-sm transition-colors hover:bg-[#1e3e2c] motion-reduce:transition-none"
        href="#notas"
        (click)="closeMenu()"
      >
        Explorar quadro de notas
        <svg
          class="size-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M7 17 17 7M7 7h10v10" />
        </svg>
      </a>

      <a
        class="inline-flex items-center justify-center gap-4 rounded-lg bg-[#936639] px-5 py-3 text-white shadow-sm transition-colors hover:bg-[#a68a64] motion-reduce:transition-none"
        href="#categorias"
        (click)="closeMenu()"
      >
        Explorar categorias
        <svg
          class="size-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M7 17 17 7M7 7h10v10" />
        </svg>
      </a>
    </nav>
  </div>
</header>
