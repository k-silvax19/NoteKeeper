
name: Build and deploy ASP.Net Core app to Azure Web App - NoteKeeper

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_PATH: ./server/src/Api/NoteKeeper.Api.csproj
  PUBLISH_PATH: ./publish

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build with dotnet
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --no-restore

      - name: Install Entity Framework CLI
        run: dotnet tool install --global dotnet-ef

      - name: Restore tools
        working-directory: ./server
        run: dotnet tool restore

      - name: Apply ORM migrations to AzureSQL
        working-directory: ./server
        shell: pwsh
        env:
          ConnectionStrings__SqlServer: ${{ secrets.AZURESQL_CONNECTION_STRING }}
          Infra__NewRelic__LicenseKey: ${{ secrets.NEWRELIC_LICENSE_KEY }}
        run: |
          dotnet ef database update `
            --project src/Infraestrutura/NoteKeeper.Infraestrutura.csproj `
            --startup-project src/Api/NoteKeeper.Api.csproj `
            --configuration Release `
            --connection "$env:ConnectionStrings__SqlServer"

      - name: Publish application
        run: dotnet publish "${{ env.PROJECT_PATH }}" --configuration Release --no-build --no-restore --output "${{ env.PUBLISH_PATH }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ env.PUBLISH_PATH }}
          if-no-files-found: error

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_74AE9F626B594AEAAE44797F7AC369E7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A20CCA3C377B4D2FA2F95642882BABB9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_85E7C8CB862B4B1092E97274B69E7B7A }}

      - name: Configure Azure Web App settings
        shell: pwsh
        env:
          AZURESQL_CONNECTION_STRING: ${{ secrets.AZURESQL_CONNECTION_STRING }}
          NEWRELIC_LICENSE_KEY: ${{ secrets.NEWRELIC_LICENSE_KEY }}
          AUTOMAPPER_LICENSE_KEY: ${{ secrets.AUTOMAPPER_LICENSE_KEY }}
        run: |
          az webapp config appsettings set `
            --resource-group "NoteKeeper" `
            --name "NoteKeeper" `
            --settings `
              "ConnectionStrings__SqlServer=$env:AZURESQL_CONNECTION_STRING" `
              "Infra__NewRelic__LicenseKey=$env:NEWRELIC_LICENSE_KEY" `
              "Apresentacao__AutoMapper__LicenseKey=$env:AUTOMAPPER_LICENSE_KEY"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'NoteKeeper'
          slot-name: 'Production'
          package: ./publish
